# 偵察 その2。
#   1. ホロ曲DB で 1,477曲ぶんのURLをまとめて取れる道を探す
#      （sitemap / ページ送り / ページ内のスクリプト）
#   2. 歌ネットの「本当の検索結果」がどのタグに入っているかを突き止める
# サイト本体（index.html）には触らない。
name: collect-samples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 偵察する
        run: |
          python3 - <<'PY'
          import gzip, io, json, re, urllib.request, urllib.error

          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0 Safari/537.36",
                "Accept-Language": "ja,en;q=0.8",
                "Accept-Encoding": "gzip"}

          def get(url, timeout=40):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read()
                  if r.headers.get("Content-Encoding") == "gzip":
                      raw = gzip.decompress(raw)
                  enc = r.headers.get_content_charset() or "utf-8"
                  return r.status, r.headers.get("Content-Type", "?"), raw, raw.decode(enc, "replace")

          def head(label, url):
              print("\n" + "-" * 68)
              print("● " + label)
              print("  " + url)
              try:
                  st, ct, raw, body = get(url)
              except urllib.error.HTTPError as e:
                  print("  !! HTTP %s %s" % (e.code, e.reason)); return None
              except Exception as e:
                  print("  !! %s: %s" % (type(e).__name__, e)); return None
              rows = body.count('class="sl-row"')
              songs = len(set(re.findall(r'/song/(\d+)/', body)))
              print("  HTTP %s / %s / %d bytes / sl-row %d / 曲URL %d種"
                    % (st, ct, len(raw), rows, songs))
              return body

          print("#" * 68)
          print("# 1. ホロ曲DB: まとめて取れる道を探す")
          print("#" * 68)

          for label, url in [
              ("robots.txt",        "https://db.holoplayer.jp/robots.txt"),
              ("sitemap.xml",       "https://db.holoplayer.jp/sitemap.xml"),
              ("sitemap-index.xml", "https://db.holoplayer.jp/sitemap-index.xml"),
          ]:
              b = head(label, url)
              if b:
                  print("  --- 中身の先頭 1200文字 ---")
                  print("  " + b[:1200].replace("\n", "\n  "))

          print("\n### ページ送りの当てずっぽう ###")
          for u in ["https://db.holoplayer.jp/song/list/?page=2",
                    "https://db.holoplayer.jp/song/list/2/",
                    "https://db.holoplayer.jp/song/list/page/2/",
                    "https://db.holoplayer.jp/song/list/?p=2",
                    "https://db.holoplayer.jp/song/list/?offset=50",
                    "https://db.holoplayer.jp/song/list/all/"]:
              head(u.split("/song/list/")[1] or "(そのまま)", u)

          print("\n### 一覧ページのスクリプトを見る ###")
          try:
              _, _, _, body = get("https://db.holoplayer.jp/song/list/")
          except Exception as e:
              print("取得できない:", e); body = ""

          if body:
              srcs = re.findall(r'<script[^>]+src="([^"]+)"', body)
              print("外部スクリプト %d本:" % len(srcs))
              for s in srcs[:20]:
                  print("  ", s)

              inline = re.findall(r"(?is)<script(?![^>]+src)[^>]*>(.*?)</script>", body)
              print("\n埋め込みスクリプト %d個。URLらしき文字列だけ拾う:" % len(inline))
              urls = set()
              for s in inline:
                  for m in re.findall(r'["\'](/[^"\']{3,80}|https?://[^"\']{5,120})["\']', s):
                      if re.search(r"json|song|api|data|list", m, re.I):
                          urls.add(m)
              for u in sorted(urls)[:40]:
                  print("  ", u)

              print("\nJSONらしい大きな塊があるか:")
              for m in re.finditer(r'type="application/json"[^>]*>(.{0,200})', body):
                  print("  ", re.sub(r"\s+", " ", m.group(1))[:200])

              print("\nsl-more の前後:")
              for m in list(re.finditer(r'sl-more', body))[:3]:
                  s = max(0, m.start() - 350)
                  print("  …" + re.sub(r"\s+", " ", body[s:m.end() + 350]))

              print("\nページ送りらしいリンク:")
              for a in set(re.findall(r'href="([^"]*(?:page|more|next|p=|\d+)/?)"', body)):
                  if "/song/" not in a and "/talent/" not in a and len(a) < 60:
                      print("  ", a)

          print("\n" + "#" * 68)
          print("# 2. 歌ネット: 本当の検索結果はどこか")
          print("#" * 68)

          for label, url in [
              ("robots.txt", "https://www.uta-net.com/robots.txt"),
          ]:
              b = head(label, url)
              if b:
                  print("  " + b[:600].replace("\n", "\n  "))

          for label, url in [
              ("曲名検索 コヨリニウム",
               "https://www.uta-net.com/search/?Aselect=2&Bselect=3&Keyword=%E3%82%B3%E3%83%A8%E3%83%AA%E3%83%8B%E3%82%A6%E3%83%A0"),
              ("アーティストページ 26384",
               "https://www.uta-net.com/artist/26384/"),
          ]:
              body = head(label, url)
              if not body:
                  continue
              m = re.search(r"(?is)<title[^>]*>(.*?)</title>", body)
              print("  title:", (m.group(1).strip() if m else "なし")[:100])

              # 曲へのリンクを、出てくる順に前後の文脈つきで見る
              hits = list(re.finditer(r'href="/song/(\d+)/"', body))
              print("  /song/ リンク %d個。1,2,6,10,14番目の前後を見る:" % len(hits))
              for i in (0, 1, 5, 9, 13):
                  if i >= len(hits):
                      break
                  h = hits[i]
                  s = max(0, h.start() - 500)
                  e = min(len(body), h.end() + 300)
                  print("\n  [%d番目 /song/%s/]" % (i + 1, h.group(1)))
                  print("  …" + re.sub(r"\s+", " ", body[s:e]))

              # table があるならその構造
              trs = re.findall(r"(?is)<tr\b[^>]*>.{20,900}?</tr>", body)
              trs = [t for t in trs if "/song/" in t]
              print("\n  /song/ を含む <tr>: %d個" % len(trs))
              for t in trs[:2]:
                  print("   ", re.sub(r"\s+", " ", t)[:700])
          PY
