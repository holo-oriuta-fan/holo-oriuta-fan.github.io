# 偵察 その3。フェスのセットリストページの作りを調べる。
# サイト本体には触らない。読むだけ。
name: collect-samples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: セットリストのページを調べる
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.error

          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0 Safari/537.36",
                "Accept-Language": "ja,en;q=0.8"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
                  return r.status, raw.decode(r.headers.get_content_charset() or "utf-8", "replace")

          def strip(x):
              return re.sub(r"\s+", " ", re.sub(r"(?s)<[^>]*>", "", x)).strip()

          for label, url in [("一覧", "https://db.holoplayer.jp/feature/setlist/"),
                             ("7th", "https://db.holoplayer.jp/feature/setlist/7th-fes/"),
                             ("1st", "https://db.holoplayer.jp/feature/setlist/1st-fes/")]:
              print("\n" + "=" * 70)
              print("■ %s  %s" % (label, url))
              print("=" * 70)
              try:
                  st, body = get(url)
              except Exception as e:
                  print("!! %s: %s" % (type(e).__name__, e)); continue
              body = re.sub(r"(?is)<(script|style)\b.*?</\1>", "", body)
              print("HTTP %s / %d文字" % (st, len(body)))

              if label == "一覧":
                  print("\n-- /feature/setlist/ 配下へのリンク --")
                  for href in dict.fromkeys(re.findall(r'href="(/feature/setlist/[^"]*)"', body)):
                      print("  ", href)
                  continue

              counts = {}
              for cls in re.findall(r'class="([^"]{1,140})"', body):
                  for c in cls.split():
                      counts[c] = counts.get(c, 0) + 1
              print("\n-- よく出てくる class（上位30） --")
              for c, n in sorted(counts.items(), key=lambda kv: -kv[1])[:30]:
                  print("  %5d  %s" % (n, c))

              print("\n-- 公演の区切りらしい見出し --")
              for m in re.finditer(r"(?is)<h([1-4])[^>]*>(.{0,160}?)</h\1>", body):
                  t = strip(m.group(2))
                  if t:
                      print("  <h%s> %s" % (m.group(1), t[:90]))

              print("\n-- 日付らしい文字列 --")
              for d in dict.fromkeys(re.findall(r"20\d\d[/.-]\d{1,2}[/.-]\d{1,2}", body)):
                  print("  ", d)

              print("\n-- /song/ID/ へのリンク: %d件（重複なし %d件） --"
                    % (len(re.findall(r'/song/(\d+)/', body)),
                       len(set(re.findall(r'/song/(\d+)/', body)))))

              # 1曲ぶんの行の実物。曲へのリンクを含む最小の要素を探す。
              print("\n-- 1曲ぶんの markup（曲リンクつき 2件 / 曲リンクなし 2件） --")
              shown_with = shown_without = 0
              for tag in ("li", "tr", "div"):
                  found = re.findall(r"(?is)<%s\b[^>]*>(?:(?!<%s\b).){30,1200}?</%s>" % (tag, tag, tag), body)
                  for f in found:
                      has = "/song/" in f
                      if has and shown_with < 2:
                          print("  [リンクあり] " + re.sub(r"\s+", " ", f)[:700]); shown_with += 1
                      elif not has and shown_without < 2 and len(strip(f)) > 4:
                          print("  [リンクなし] " + re.sub(r"\s+", " ", f)[:700]); shown_without += 1
                      if shown_with >= 2 and shown_without >= 2:
                          break
                  if shown_with >= 2 and shown_without >= 2:
                      break

              print("\n-- 公演の塊の始まり（最初の1つ、800文字） --")
              m = re.search(r'(?is)(STAGE\s*1|DAY\s*1)', body)
              if m:
                  a = max(0, m.start() - 400)
                  print("  …" + re.sub(r"\s+", " ", body[a:m.start() + 800]))
          PY
